<!DOCTYPE html>
<html>
<head>
  <title>NBA Stats Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>NBA Stats Dashboard</h1>

  <section>
    <h2>Search Players</h2>
    <input id="searchInput" placeholder="Enter player name">
    <button onclick="searchPlayer()">Search</button>
  </section>

  <section>
    <h2>Players</h2>
    <div id="playersResults"></div>
  </section>

  <section>
    <h2>Player Info</h2>
    <div id="statsResults"></div>
  </section>

  <section>
    <h2>Favorites</h2>
    <button onclick="loadFavorites()">Refresh Favorites</button>
    <div id="favoritesResults"></div>
  </section>

  <script src="app.js"></script>
</body>
</html>
