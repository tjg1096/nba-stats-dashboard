<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <title>NBA Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>NBA Dashboard</h1>

  <div id="loginSection">
  <div id="g_id_onload"
       data-client_id="192011811875-74km7c8s5ljfk44v135qvudtdvkpdujg.apps.googleusercontent.com"
       data-callback="handleCredentialResponse">
  </div>

  <div class="g_id_signin"
       data-type="standard"
       data-size="large"
       data-theme="outline"
       data-text="signin_with"
       data-shape="rectangular">
  </div>
</div>

<div id="userInfo"></div>

  <section>
    <h2>Search Players</h2>
    <input id="searchInput" placeholder="Enter player name">
    <button onclick="searchPlayer()">Search</button>
  </section>

  <section>
    <h2>Players</h2>
    <div id="playersResults"></div>
  </section>

  <section>
    <h2>Game Scores</h2>
    <div id="statsResults"></div>
    <button onclick="getStats()">Load Today's Games</button>
  </section>

  <section>
    <h2>Favorites</h2>
    <button onclick="loadFavorites()">Refresh Favorites</button>
    <div id="favoritesResults"></div>
  </section>

  <script src="app.js"></script>
</body>
</html>
